# XcodeGen manifest — `cd Apps/iOS && xcodegen` regenerates Ammo.xcodeproj.
# The .xcodeproj is gitignored; this file is the source of truth.
name: Ammo
options:
  bundleIdPrefix: com.brandon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  UsageKit:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Set your team once here (or in Xcode's Signing & Capabilities pane) and
    # re-run xcodegen: DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  Ammo:
    type: application
    platform: iOS
    sources:
      - path: Ammo
      - path: Shared
    dependencies:
      - package: UsageKit
        product: UsageKit
      - target: AmmoWidgets
    info:
      path: Ammo/Info.plist
      properties:
        CFBundleDisplayName: Ammo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        BGTaskSchedulerPermittedIdentifiers: [com.brandon.ammo.refresh]
        UIBackgroundModes: [fetch]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Ammo/Ammo.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brandon.ammo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon.ammo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AmmoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AmmoWidgets
      - path: Shared
    dependencies:
      - package: UsageKit
        product: UsageKit
    info:
      path: AmmoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ammo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AmmoWidgets/AmmoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brandon.ammo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon.ammo.widgets
        SKIP_INSTALL: true

schemes:
  Ammo:
    build:
      targets:
        Ammo: all
    run:
      config: Debug
